{# Two-state switch. Light is the default and the stored value is the only
   thing that overrides it, so a visitor's choice survives but no system
   preference silently flips the page. #}
<div class="theme-switch" role="group" aria-label="Colour theme">
  <button type="button" data-theme-set="light" aria-pressed="true" aria-label="Light theme"
          title="Light">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" aria-hidden="true">
      <circle cx="12" cy="12" r="4.2"/>
      <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
    </svg>
  </button>
  <button type="button" data-theme-set="dark" aria-pressed="false" aria-label="Dark theme"
          title="Dark">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M20.5 14.3A8.5 8.5 0 1 1 9.7 3.5a6.8 6.8 0 0 0 10.8 10.8z"/>
    </svg>
  </button>
</div>
