# nginx vhost for chatmcd.mdeller.com.
#
# Two things here are load-bearing and easy to get wrong:
#
#  1. SSE must not be buffered. Without `proxy_buffering off` nginx holds the
#     token stream until its buffer fills, and the answer arrives in one lump
#     after the model has finished — the streaming works perfectly and looks
#     completely broken.
#  2. Headers set inside a location block REPLACE the ones set outside it, so
#     Cache-Control is set in each location that needs it rather than once at
#     the top.
#
# certbot writes `listen 443 ssl;`. This droplet runs nginx 1.24, where the
# http2 directive is still a listen parameter, so the post-certbot patch is
# `listen 443 ssl http2;` — NOT the `http2 on;` form from 1.25.1. Check an
# existing vhost before editing: grep -h "listen 443" /etc/nginx/sites-available/*

server {
    listen 80;
    listen [::]:80;
    server_name chatmcd.mdeller.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chatmcd.mdeller.com;

    # certbot fills these in:
    # ssl_certificate     /etc/letsencrypt/live/chatmcd.mdeller.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/chatmcd.mdeller.com/privkey.pem;

    # TWO log lines, both in `vhost` format, and both are load-bearing.
    #
    # mdeller-stats.py counts an app's hits by matching a beacon regex against
    # the SHARED /var/log/nginx/access.log, which only carries the host when the
    # format is `vhost`. A vhost that logs solely to its own private file reads a
    # flat zero from the day it launched while its beacon fires perfectly --
    # which is exactly what happened to ButtFold, and what this vhost was set up
    # to repeat. The private file stays for per-app debugging.
    access_log /var/log/nginx/access.log vhost;
    access_log /var/log/nginx/chatmcd.access.log vhost;
    error_log  /var/log/nginx/chatmcd.error.log;

    client_max_body_size 64k;   # the API takes a question, not an upload

    # --- the token stream --------------------------------------------------
    location /api/chat {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header Cache-Control "no-cache, no-transform" always;
        add_header X-Accel-Buffering "no" always;
    }

    # --- versioned static assets ------------------------------------------
    # Every URL carries ?v=<mtime>, so a long cache is safe and a deploy still
    # shows up immediately.
    location /static/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # --- everything else ---------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        # HTML is never cached: the pages carry ?v= asset URLs, and a stale page
        # pins stale assets.
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
}
